
<html>
<head>
    <title>Curriculum vitae</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
    body, body *, input, textarea, button, select {
        font-family: 'Playfair Display', serif !important;
    }
    </style>
</head>

<body bgcolor="#D2D3CD" leftmargin="0" topmargin="0"
      marginwidth="0" marginheight="0">

    <form name="contacto"
          action="mailto:fulano@gmail.com"
          method="post"
          enctype="text/plain">

        <table width="600" border="0" align="center">

            <tr align="center">
                <td colspan="4" height="150">
                    <font size="6" face="Verdana, Arial, Helvetica, sans-serif">
                        CONTACTAR
                    </font>
                </td>
            </tr>

            <tr height="50">
                <td colspan="4">&nbsp;</td>
            </tr>

            <tr height="40">
                <td colspan="4">
                    <font face="Arial, Helvetica, sans-serif">
                        Nombre:&nbsp;&nbsp;&nbsp;&nbsp;
                    </font>
                    <input type="text" name="nombre"
                           size="30" maxlength="50">
                </td>
            </tr>

            <tr height="40">
                <td colspan="4">
                    <font face="Arial, Helvetica, sans-serif">
                        Direccion:
                    </font>
                    <input type="text" name="direccion"
                           size="50" maxlength="70">
                </td>
            </tr>

            <tr height="40">
                <td colspan="4">
                    <font face="Arial, Helvetica, sans-serif">
                        Telefono:
                    </font>
                    <input type="tel" name="telefono"
                           size="12" maxlength="12">
                </td>
            </tr>

            <tr height="80">
                <td width="69" valign="top">
                    <font face="Arial, Helvetica, sans-serif">
                        <br>
                        Mensaje:
                    </font>
                </td>

                <td colspan="3">
                    &nbsp;
                    <textarea name="mensaje"
                              cols="50" rows="3"></textarea>
                </td>
            </tr>

            <tr>
                <td width="70">&nbsp;</td>

                <td width="220" align="center" valign="bottom">
                    <input type="submit"
                           name="mandar" value="Enviar">
                </td>

                <td width="220" align="center" valign="bottom">
                    <input type="reset"
                           name="borrar" value="Borrar">
                </td>

                <td width="70">&nbsp;</td>
            </tr>

        </table>
    </form>

</body>
</html>
